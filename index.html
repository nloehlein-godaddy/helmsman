<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e1b19" />
    <title>↻ Helmsman</title>
    <style>
      html { background: var(--bg, #0e1b19); }
      body { margin: 0; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg, #0e1b19);
        color: var(--text, #e5efe8);
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Helmsman is starting">
      <div class="boot-stage">
        <svg class="boot-emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <use href="/helm-emblem.svg#helm-emblem" />
        </svg>
        <span class="boot-word">Helmsman</span>
        <p class="boot-tag" data-boot-term="bootTagline">Loading your workspace…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
